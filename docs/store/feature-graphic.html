<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:#202226}
svg{display:block;width:1024px;height:500px}
</style></head><body>
<svg viewBox="0 0 1024 500" font-family="Liberation Sans, Arial, sans-serif" font-weight="800">
  <g id="grp">
    <rect id="sq" x="0" y="0" width="180" height="180" rx="42" fill="#0071e3"/>
    <text id="g" fill="#fff" font-size="132">b</text>
    <text id="w" font-size="124" letter-spacing="-3" fill="#fff">Book<tspan fill="#0071e3">Sero</tspan></text>
  </g>
</svg>
<script>
  const g=document.getElementById('g'), w=document.getElementById('w'), grp=document.getElementById('grp');
  // 1. „b" geometrycznie w środku kwadratu (środek obrysu glifu = (90,90)).
  let bb=g.getBBox(); g.setAttribute('x',90-(bb.x+bb.width/2)); g.setAttribute('y',90-(bb.y+bb.height/2));
  // 2. napis na prawo od kwadratu, wyrównany w pionie do środka kwadratu.
  const GAP=44; let wb=w.getBBox();
  w.setAttribute('x',180+GAP-wb.x); w.setAttribute('y',90-(wb.y+wb.height/2));
  // 3. cała grupa (kwadrat + napis) dokładnie w środku płótna 1024×500.
  const gb=grp.getBBox();
  grp.setAttribute('transform',`translate(${512-(gb.x+gb.width/2)},${250-(gb.y+gb.height/2)})`);
</script>
</body></html>
