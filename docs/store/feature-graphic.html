<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:#0b0d10;font-family:"Liberation Sans",Arial,Helvetica,sans-serif}
.bg{position:absolute;inset:0;background:
 radial-gradient(600px 380px at 18% 30%,rgba(0,113,227,.28),transparent 70%),
 radial-gradient(520px 320px at 85% 80%,rgba(0,113,227,.18),transparent 70%),#0b0d10}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:44px}
.icon{width:180px;height:180px;border-radius:42px;background:#0071e3;box-shadow:0 18px 50px rgba(0,113,227,.35)}
.icon svg{width:180px;height:180px;display:block}
.name{font-weight:800;font-size:124px;letter-spacing:-3px;line-height:1;color:#fff}
.name b{color:#0071e3;font-weight:800}
</style></head><body><div class="bg"></div>
<div class="wrap">
  <div class="icon"><svg viewBox="0 0 180 180"><text id="g" x="0" y="0" fill="#fff" font-family="Liberation Sans, Arial, sans-serif" font-weight="800" font-size="132">b</text></svg></div>
  <div class="name">Book<b>Sero</b></div>
</div>
<script>
  // Wyśrodkowanie GEOMETRYCZNE glifu „b": środek jego obrysu = środek kwadratu.
  const g=document.getElementById('g'); const bb=g.getBBox();
  g.setAttribute('x', 90-(bb.x+bb.width/2)); g.setAttribute('y', 90-(bb.y+bb.height/2));
</script>
</body></html>
